<!DOCTYPE html>
<html lang="fr" class="taille-normale">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Aube</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/aube.css">
</head>
<body>

  <!-- Écran d'attente : symbole centré sur fond blanc -->
  <div id="chargement" class="chargement">
    <img src="icons/symbole.png" alt="">
  </div>

  <div id="appli" hidden>
    <!-- Barre du haut -->
    <header class="barre-haut">
      <div class="barre-haut-in">
        <button type="button" id="btn-retour" class="btn-retour" aria-label="Retour" hidden>←</button>
        <a href="#/accueil" class="marque">
          <img src="icons/symbole.png" alt="">
          <span>AUBE</span>
        </a>
      </div>
    </header>

    <div id="bandeau"></div>

    <!-- Contenu de l'écran courant -->
    <main id="contenu" tabindex="-1"></main>

    <!-- Barre de navigation du bas -->
    <nav class="nav-bas" aria-label="Navigation principale">
      <a href="#/accueil" class="nav-item" data-nav="accueil">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V20h14V9.5"/></svg>
        <span>Accueil</span>
      </a>
      <a href="#/parcours" class="nav-item" data-nav="parcours">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>
        <span>Parcours</span>
      </a>
      <a href="#/espace" class="nav-item" data-nav="espace">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span>Mon espace</span>
      </a>
      <a href="#/infos" class="nav-item" data-nav="infos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.5" r=".7"/></svg>
        <span>Infos</span>
      </a>
    </nav>
  </div>

  <!-- Filet de sécurité : si l'application n'a pas démarré après 8 s, on explique au lieu de rester bloqué -->
  <script>
  (function () {
    setTimeout(function () {
      var c = document.getElementById("chargement");
      if (!c || c.hidden) return;
      var cause = !window.Aube ? "Le fichier js/aube-core.js est absent ou incomplet."
        : !window.Routeur ? "Le fichier js/router.js est absent ou incomplet."
        : !window.__aubeDemarre ? "Le fichier js/ui.js est absent ou incomplet."
        : "Le chargement des données est trop lent. Vérifiez votre connexion.";
      var zone = document.createElement("div");
      zone.setAttribute("role", "alert");
      zone.style.cssText = "position:absolute;left:0;right:0;bottom:12%;padding:0 24px;text-align:center;font:16px/1.5 system-ui,sans-serif;color:#171717";
      var t = document.createElement("p"); t.textContent = "Le chargement dure plus longtemps que prévu."; t.style.fontWeight = "700";
      var d = document.createElement("p"); d.textContent = cause; d.style.cssText = "color:#6B6B6B;font-size:14px";
      function bouton(txt, fn) {
        var b = document.createElement("button"); b.type = "button"; b.textContent = txt;
        b.style.cssText = "margin:6px;padding:14px 20px;min-height:48px;border:1px solid #171717;background:#171717;color:#fff;font:700 15px system-ui,sans-serif";
        b.onclick = fn; return b;
      }
      function reparer() {
        var f = [];
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) f.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
        if (window.caches && caches.keys) f.push(caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }));
        Promise.all(f).catch(function () {}).then(function () { location.reload(); });
      }
      zone.append(t, d, bouton("Réessayer", function () { location.reload(); }), bouton("Réparer l’application", reparer));
      c.append(zone);
    }, 8000);
  })();
  </script>

  <script src="js/aube-core.js"></script>
  <script src="js/router.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pwa-register.js"></script>
</body>
</html>
